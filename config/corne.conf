# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# EXPERIMENT: RGB underglow disabled to test whether the WS2812 driver
# was the suspend-failing device that kept the chip out of System OFF
# on the pre-TP baseline. If wake-from-20-min-idle now breaks on this
# build the way it does on current main, theory confirmed.
# See docs/SLEEP_WAKE_INVESTIGATION.md.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
# Underglow auto-off flags below are no-ops with underglow off; left in
# place so the diff against baseline/pre-tp is exactly the two lines above.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_MOUSE=y

# Power management
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
